function M(c,rough=.72,metal=.05){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}

 for(let z=-d/2+2;z<d/2;z+=5){let l=new THREE.PointLight(0xffdfae,35,8,2);l.position.set(0,4.35,z);S.scene.add(l);let fixture=cube(0,4.5,z,2,.08,.35,0xe6d7b5);fixture.material.emissive=new THREE.Color(0x6b5a39);fixture.material.emissiveIntensity=.35}

 if(a==="locker"){if(!S.items.has("badge"))return dialog("置物櫃","需要警衛證。");S.flags.tape=1;S.items.add("tape");objective("第四章 · B1","B3 已出現在電梯選單");dialog("置物櫃","找到標記 <b>00:47 / CONTROL ROOM</b> 的錄音帶。");return}
 if(a==="recorder"){if(!S.items.has("tape"))return dialog("錄音機","卡槽是空的。");S.flags.record=1;objective("第五章 · B3","調查事故檔案櫃");dialog("00:47 錄音","小晴：「煙進來了！開門！」<br>警衛：「防火門卡住了！」<div class='note'>妳：「不要開。火會燒到整棟樓。」</div>");return}
 if(a==="archive"){if(!S.flags.record)return dialog("事故檔案","先播放錄音。");dialog("事故真相","三年前 B3 起火。妳在 00:47 手動鎖死防火門以阻止火勢蔓延，小晴沒有逃出來。",[["記住全部",()=>ending("TRUE END · 00:48","時鐘終於跳到 00:48。妳無法改變過去，但停止逃避。")],["再次離開",()=>ending("LOOP END · 00:47","電梯門關上。那段來自明天的影片再次出現。")]]);return}
}
function ending(t,b){$("#dialog").style.display="none";$("#et").textContent=t;$("#eb").textContent=b;$("#ending").style.display="flex"}
function rayhit(){S.ray.setFromCamera(new THREE.Vector2(0,0),S.cam);let hits=S.ray.intersectObjects(S.scene.children,true);for(let h of hits){let r=h.object.userData.root;if(r&&r.userData.action&&h.distance<5.5)return r}return null}
function blocked(x,z){let rad=.34;if(x<-S.bounds.x||x>S.bounds.x||z<-S.bounds.z||z>S.bounds.z)return true;for(let c of S.colliders)if(Math.abs(x-c.x)<c.w/2+rad&&Math.abs(z-c.z)<c.d/2+rad)return true;return false}
function interact(){let r=rayhit();if(r)act(r.userData.action)}
function init(){
 S.scene=new THREE.Scene();S.scene.background=new THREE.Color(0x0e1115);S.scene.fog=new THREE.FogExp2(0x0e1115,.017);
 S.cam=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.08,100);
 S.ren=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});S.ren.setPixelRatio(Math.min(devicePixelRatio,1.5));S.ren.setSize(innerWidth,innerHeight);S.ren.outputColorSpace=THREE.SRGBColorSpace;S.ren.toneMapping=THREE.ACESFilmicToneMapping;S.ren.toneMappingExposure=1.35;$("#game").appendChild(S.ren.domElement);
 S.ray=new THREE.Raycaster();S.clock=new THREE.Clock();room("elevator");
 let cv=S.ren.domElement;
 cv.onpointerdown=e=>{if(e.clientX>innerWidth*.35){S.drag=true;S.lastX=e.clientX;S.lastY=e.clientY;cv.setPointerCapture?.(e.pointerId)}};
 cv.onpointermove=e=>{if(S.drag){S.yaw-=(e.clientX-S.lastX)*.0032;S.pitch=Math.max(-.9,Math.min(.9,S.pitch-(e.clientY-S.lastY)*.0028));S.lastX=e.clientX;S.lastY=e.clientY}};
 cv.onpointerup=cv.onpointercancel=()=>S.drag=false;
 let joy=$("#joy"),stick=$("#stick"),pid=null;
 function jm(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.hypot(x,y)||1,k=Math.min(33,m)/m,nx=x*k,ny=y*k;stick.style.transform=`translate(${nx}px,${ny}px)`;S.input.set(nx/33,-ny/33)}
 joy.onpointerdown=e=>{pid=e.pointerId;joy.setPointerCapture(pid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===pid)jm(e)};joy.onpointerup=joy.onpointercancel=()=>{pid=null;S.input.set(0,0);stick.style.transform=""};
 addEventListener("resize",()=>{S.cam.aspect=innerWidth/innerHeight;S.cam.updateProjectionMatrix();S.ren.setSize(innerWidth,innerHeight)});
 function loop(){requestAnimationFrame(loop);let dt=Math.min(.035,S.clock.getDelta());
   let dialogOpen=$("#dialog").style.display==="flex"||$("#ending").style.display==="flex";
   let tx=dialogOpen?0:S.input.x,ty=dialogOpen?0:S.input.y;
   let smooth=1-Math.exp(-10*dt);S.vel.x+=(tx-S.vel.x)*smooth;S.vel.y+=(ty-S.vel.y)*smooth;
   let speed=3.1,fx=Math.sin(S.yaw),fz=-Math.cos(S.yaw),rx=Math.cos(S.yaw),rz=Math.sin(S.yaw);
   let dx=(fx*S.vel.y+rx*S.vel.x)*speed*dt,dz=(fz*S.vel.y+rz*S.vel.x)*speed*dt;
   let nx=S.cam.position.x+dx,nz=S.cam.position.z;if(!blocked(nx,nz))S.cam.position.x=nx;
   nx=S.cam.position.x;nz=S.cam.position.z+dz;if(!blocked(nx,nz))S.cam.position.z=nz;
   S.cam.rotation.order="YXZ";S.cam.rotation.y=S.yaw;S.cam.rotation.x=S.pitch;
   let r=rayhit();$("#cross").classList.toggle("hot",!!r);$("#prompt").classList.toggle("on",!!r);if(r)$("#prompt").textContent="調查 · "+r.name;
   S.ren.render(S.scene,S.cam)
 }loop()
}
$("#start").onclick=()=>{if(typeof THREE==="undefined")return alert("3D 引擎載入失敗，請重新整理。");$("#overlay").style.display="none";init();beep(220,.08)};
$("#act").onclick=interact;
$("#hint").onclick=()=>dialog("提示",{elevator:"右側是樓層控制面板。",six:S.items.has("key")?"小鑰匙能打開木製玩具箱。":"先找櫥窗人偶。",four:S.items.has("receipt")?"拿收據去收銀機。":"先找燒焦餐桌。",two:S.items.has("lens")?"用鏡片調查試衣間。":"先看試衣鏡。",b1:S.items.has("badge")?"警衛證能開置物櫃。":"先到警衛崗亭。",b3:S.flags.record?"去事故檔案櫃。":"先播放錄音帶。"}[S.room]);
$("#sound").onclick=()=>{S.sound=!S.sound;$("#sound").textContent=S.sound?"🔊":"🔇";if(S.hum)S.hum.gain.value=S.sound?.01:0};
$("#full").onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();
})();
</script>
